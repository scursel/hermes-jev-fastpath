name: test

# Hermes source used by CI: the pinned PyPI release `hermes-agent==0.21.3` (matching the
# plugin's `requires_hermes: ">=0.21.3"`). The pytest environment comes from this repo's
# `[test]` extra, which pins pytest>=8,<9 as declared.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      # actions/checkout v4.2.2 (pinned to commit SHA)
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      # actions/setup-python v5.6.0 (pinned to commit SHA)
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies and Hermes Agent
        run: python -m pip install -e '.[test]' hermes-agent==0.21.3

      - name: Byte-compile
        run: python -m compileall -q jev_fastpath scripts __init__.py

      - name: Unit and integration tests
        env:
          # The default suite never requires credentials or network; the live TypeSafe
          # probe is optional and excluded.
          TYPESAFE_API_KEY: ""
        run: python -m pytest -q

      - name: Manifest parse smoke
        run: |
          python - <<'PY'
          from pathlib import Path
          from hermes_cli.plugins import parse_manifest_file
          m = parse_manifest_file(Path('plugin.yaml'), Path('.'), 'ci', '')
          assert m is not None and m.name == 'jev-fastpath', m
          assert m.kind == 'standalone'
          assert int(m.manifest_version) == 2
          print('manifest ok:', m.name, m.version)
          PY

      - name: Credential-free plugin smoke
        run: python scripts/smoke_plugin.py

      - name: Plugin doctor
        run: hermes plugins doctor . --ci

      - name: Plugin catalog validation
        run: hermes plugins validate .

      - name: Forbidden implementation patterns
        run: python scripts/check_forbidden_patterns.py

      - name: SkillSpector release gate (mandatory)
        run: |
          python -m pip install skillspector==2.5.3 || {
            echo "skillspector could not be installed; the release gate cannot run." >&2
            exit 1
          }
          scripts/skillspector_gate.sh
