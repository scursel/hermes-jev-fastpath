name: test

# Hermes source used by CI: the immutable upstream commit
# `7c6f21a5e12ba9b1c674ec9b410fa6b8c45de4f8` (Hermes Agent v0.21.3), matching
# the checkout used for local host-contract tests and the plugin's
# `requires_hermes: ">=0.21.3"`. PyPI currently stops at 0.19.0, so CI must not
# pretend `hermes-agent==0.21.3` exists there. The pytest environment comes from
# this repo's `[test]` extra, which pins pytest>=8,<9 as declared.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      # actions/checkout v4.2.2 (pinned to commit SHA)
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      # actions/setup-python v5.6.0 (pinned to commit SHA)
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}

      # Hermes intentionally refuses wheel/sdist builds; its supported development path
      # is an editable checkout. Keep that checkout outside this plugin tree: the Hermes
      # catalog validator recursively security-scans the directory it is asked to validate.
      - name: Checkout pinned Hermes Agent source
        env:
          HERMES_AGENT_SHA: 7c6f21a5e12ba9b1c674ec9b410fa6b8c45de4f8
        run: |
          git init "$RUNNER_TEMP/hermes-agent"
          git -C "$RUNNER_TEMP/hermes-agent" remote add origin https://github.com/NousResearch/hermes-agent.git
          git -C "$RUNNER_TEMP/hermes-agent" fetch --depth=1 origin "$HERMES_AGENT_SHA"
          git -C "$RUNNER_TEMP/hermes-agent" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/hermes-agent" rev-parse HEAD)" = "$HERMES_AGENT_SHA"

      - name: Install test dependencies and pinned Hermes Agent source
        run: |
          python -m pip install -e '.[test]'
          python -m pip install -e "$RUNNER_TEMP/hermes-agent"

      - name: Byte-compile
        run: python -m compileall -q jev_fastpath scripts __init__.py

      - name: Unit and integration tests
        env:
          # The default suite never requires credentials or network; the live TypeSafe
          # probe is optional and excluded.
          TYPESAFE_API_KEY: ""
        run: python -m pytest -q

      - name: Manifest parse smoke
        run: |
          python - <<'PY'
          from pathlib import Path
          from hermes_cli.plugins import parse_manifest_file
          m = parse_manifest_file(Path('plugin.yaml'), Path('.'), 'ci', '')
          assert m is not None and m.name == 'jev-fastpath', m
          assert m.kind == 'standalone'
          assert int(m.manifest_version) == 1
          print('manifest ok:', m.name, m.version)
          PY

      - name: Credential-free plugin smoke
        run: python scripts/smoke_plugin.py

      - name: Plugin doctor
        run: hermes plugins doctor . --ci

      - name: Plugin catalog validation
        run: hermes plugins validate .

      - name: Forbidden implementation patterns
        run: python scripts/check_forbidden_patterns.py

      - name: SkillSpector release gate (mandatory)
        if: matrix.python-version == '3.12'
        run: |
          python -m pip install 'skillspector @ git+https://github.com/NVIDIA/skillspector.git@0562b964ec5ceac67ee15c163738e5404f14a908' || {
            echo "SkillSpector v2.5.3 could not be installed from its pinned source commit; the release gate cannot run." >&2
            exit 1
          }
          skillspector --version | grep -F 'SkillSpector v2.5.3'
          scripts/skillspector_gate.sh
